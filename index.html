<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tip Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="form">
      <h1>Tip Calculator</h1>
      <p class="subtitle">Enter your bill and tip percentage to see the total.</p>

      <label for="bill">Bill amount</label>
      <input type="number" id="bill" placeholder="Bill amount (₹)">

      <label for="tip">Tip percentage</label>
      <input type="number" id="tip" placeholder="Tip percentage (%)">

      <button id="calc">Calculate</button>
    </div>

    <div class="results">
      <div class="result">
        <p class="label">Tip</p>
        <p class="value">₹<span id="tip-amount">0.00</span></p>
      </div>
      <div class="result">
        <p class="label">Total</p>
        <p class="value">₹<span id="total">0.00</span></p>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
